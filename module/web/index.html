<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark light"><title>Cellforge</title>
<style>
:root{font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#e9f0ef;background:#101917;font-synthesis:none}*{box-sizing:border-box}body{margin:0}main{max-width:850px;margin:auto;padding:38px 22px 50px}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:30px}h1{font-size:27px;letter-spacing:-1px;margin:0}small,.label{color:#97aaa3;font-size:13px}header small{display:block;margin-top:7px}.status{border:1px solid #32473f;border-radius:20px;padding:24px;background:#182720;margin-bottom:20px}.status strong{font-size:23px}.dot{display:inline-block;width:12px;height:12px;border-radius:50%;background:#81958b;margin-right:10px}#detail{line-height:1.7;color:#b1c2bb;margin:12px 0 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.card{padding:23px;background:#19241f;border:1px solid #2a3a32;border-radius:17px}.value{font-size:29px;font-variant-numeric:tabular-nums;margin-top:12px;letter-spacing:-.7px}.unit{font-size:14px;color:#97aaa3;margin-left:5px}.row{display:flex;justify-content:space-between;gap:16px;padding:15px 0;border-bottom:1px solid #293830}.row span:last-child{text-align:right;overflow-wrap:anywhere}section.info{padding:10px 4px;margin-top:21px}footer{font-size:12px;line-height:1.8;color:#8b9f95;margin-top:25px}#notice{color:#e0ba77}a{color:#9be0c0}@media(max-width:420px){main{padding:25px 16px}.card{padding:19px}.value{font-size:24px}}@media(prefers-color-scheme:light){:root{background:#f4f7f3;color:#153629}.card{background:#fff;border-color:#d5e0d5}.status{background:#e7f2e9;border-color:#c4d9c9}#detail,.label,small,footer{color:#587064}.row{border-color:#dce4dc}.unit{color:#587064}#notice{color:#936718}}
</style></head><body><main>
<header><div><h1>Cellforge</h1><small>1.0.0 · 试运行</small></div><small id="updated">正在连接</small></header>
<div class="status"><strong><i class="dot" id="dot"></i><span id="state">读取连接状态</span></strong><p id="detail">正在获取模块信息。</p></div>
<div class="grid">
<div class="card"><div class="label">当前下载</div><div class="value" id="down-speed">—</div></div>
<div class="card"><div class="label">当前上传</div><div class="value" id="up-speed">—</div></div>
<div class="card"><div class="label">本次下载</div><div class="value" id="down-total">—</div></div>
<div class="card"><div class="label">本次上传</div><div class="value" id="up-total">—</div></div>
</div>
<section class="info">
<div class="row"><span class="label">移动网络</span><span id="radio">—</span></div>
<div class="row"><span class="label">信号强度</span><span id="signal">—</span></div>
<div class="row"><span class="label">设备 IP</span><span id="peer">—</span></div>
<div class="row"><span class="label">模块局域网 IP</span><span id="local">—</span></div>
<div class="row"><span class="label">蜂窝接口 IP</span><span id="cell">—</span></div>
<div class="row"><span class="label">本次连接时长</span><span id="duration">—</span></div>
<div class="row"><span class="label">恢复状态</span><span id="recovery">—</span></div>
</section>
<footer><div id="notice"></div>流量包含模块自身的联网检测，与运营商账单可能存在差异。页面关闭后，模块仍独立维护连接。</footer>
</main><script>
const $=id=>document.getElementById(id);let lastStamp=null,lastAdvance=0;
const labels={active:['连接正常','设备侧通信与模块联网检测正常。'],recovering:['正在恢复连接','模块正在主动与设备通信。'],backoff:['等待设备恢复','本轮主动恢复已达到上限，等待 USB 状态变化。'],limited:['连接尚未确认','移动网络状态已获取，设备连接或互联网检测暂未确认。'],detached:['等待连接设备','模块尚未建立设备连接。'],checking:['正在检查连接','等待新的连接证据。'],radio_fault:['移动网络异常','请检查 SIM 卡、网络覆盖及运营商服务。']};
function bytes(v,suffix=''){if(v===null||!Number.isFinite(v))return '暂不可用';const units=['B','KB','MB','GB','TB'];let i=0;while(v>=1024&&i<units.length-1){v/=1024;i++}return `${v.toFixed(i?1:0)}<span class="unit">${units[i]}${suffix}</span>`}
function offline(message){$('state').textContent=message;$('detail').textContent='请确认模块仍连接，并等待重新获取状态。';$('dot').style.background='#9e8c70';$('updated').textContent='状态未更新';for(const id of ['down-speed','up-speed'])$(id).textContent='暂不可用'}
async function refresh(){const controller=new AbortController();const deadline=setTimeout(()=>controller.abort(),4000);try{const response=await fetch('status.json',{cache:'no-store',signal:controller.signal});if(!response.ok)throw Error('unavailable');const d=await response.json();const now=Date.now();if(d.updated_uptime!==lastStamp){lastStamp=d.updated_uptime;lastAdvance=now}if(now-lastAdvance>6000){offline('状态更新暂停');return}const info=labels[d.state]||labels.checking;$('state').textContent=info[0];$('detail').textContent=info[1];$('dot').style.background=d.led.startsWith('blue')?'#58a6ed':d.led.startsWith('red')?'#ef7972':d.led.startsWith('yellow')?'#e8c45c':'#69ba80';$('updated').textContent='刚刚更新';$('down-speed').innerHTML=bytes(d.download_Bps,'/s');$('up-speed').innerHTML=bytes(d.upload_Bps,'/s');$('down-total').innerHTML=bytes(d.download_bytes);$('up-total').innerHTML=bytes(d.upload_bytes);$('radio').textContent=d.network_type==='unknown'?'暂不可用':d.network_type;$('signal').textContent=d.signal_dbm===null?'暂不可用':`${d.signal_dbm} dBm`;$('peer').textContent=d.device_ip||'待确认';$('local').textContent=d.local_ip;$('cell').textContent=d.cellular_ip||'暂不可用';$('duration').textContent=`${Math.floor(d.session_seconds/3600)} 小时 ${Math.floor(d.session_seconds/60)%60} 分钟`;$('recovery').textContent=d.state==='recovering'?'主动恢复中':d.recovery_attempts?`本轮已尝试 ${d.recovery_attempts} 次`:'持续监测中';$('notice').textContent=d.discontinuities?'检测到计数器变化，累计值可能不完整。':d.led_control?'':'灯光暂由原厂控制。'}catch{offline('暂时无法读取模块')}finally{clearTimeout(deadline);setTimeout(refresh,1500)}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden){lastStamp=null;lastAdvance=Date.now()}});refresh();
</script></body></html>
